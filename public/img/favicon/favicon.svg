<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369A1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#grad1)"/>

  <!-- Central monogram 'T' with clean geometric design -->
  <g>
    <!-- Horizontal bar (top of T) -->
    <rect x="60" y="70" width="136" height="18" rx="4" fill="white" opacity="0.95"/>
    
    <!-- Vertical stem (down of T) -->
    <rect x="115" y="88" width="26" height="98" rx="4" fill="white" opacity="0.95"/>
    
    <!-- Accent: small circuit-like elements on sides -->
    <circle cx="50" cy="88" r="4" fill="white" opacity="0.7"/>
    <line x1="50" y1="88" x2="60" y2="88" stroke="white" stroke-width="2" opacity="0.6"/>
    
    <circle cx="206" cy="88" r="4" fill="white" opacity="0.7"/>
    <line x1="206" y1="88" x2="196" y2="88" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Bottom accent line (representing growth/direction) -->
  <path d="M 80 200 Q 128 210 176 200" stroke="white" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
